name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Tags are vX.Y.Z; the bundle and the cask both want X.Y.Z.
          echo "tag=$TAG"                     >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"             >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Test before shipping
        # A release that fails its own tests is worse than no release.
        run: swift test --parallel

      - name: Build the app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh

      - name: Ad-hoc sign and package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/AgentPet.app"

          # Ad-hoc: enough for a downloaded copy to run, and enough to keep a
          # stable bundle identity across launches. A Developer ID would remove
          # the Gatekeeper warning entirely; until then the cask strips the
          # quarantine attribute on install.
          codesign --force --deep --sign - "$APP"

          # ditto preserves the bundle's symlinks and metadata; zip(1) does not.
          ZIP="AgentPet-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          SHA256=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP"           >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"     >> "$GITHUB_OUTPUT"
          echo "packaged $ZIP"
          echo "sha256   $SHA256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
          else
            gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
              --title "Agent Pet Runtime ${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentPet-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

      - name: Sync the Homebrew cask
        env:
          # A deploy key with write access to the tap repository.
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          # Not a failure when unset: the release still shipped, and the
          # checksum is printed so the cask can be updated by hand.
          if [ -z "$TAP_SSH_KEY" ]; then
            echo "::notice::TAP_SSH_KEY is not set; skipping the cask update."
            echo "          URL:    https://github.com/${{ github.repository }}/releases/download/v${VERSION}/AgentPet-${VERSION}.zip"
            echo "          SHA256: ${SHA256}"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/taptap
          git clone --quiet git@github.com:dncore/homebrew-agent-pet-runtime.git /tmp/taptap
          cd /tmp/taptap

          # The cask lives in this repository as a template so it can be
          # reviewed and edited like any other file, rather than assembled
          # inside the workflow where nobody would notice it changing.
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA256}/" \
            "$GITHUB_WORKSPACE/homebrew/agent-pet-runtime.rb.template" \
            > Casks/agent-pet-runtime.rb

          # A placeholder left behind would ship a cask pointing nowhere.
          if grep -q "__" Casks/agent-pet-runtime.rb; then
            echo "::error::the cask still contains unsubstituted placeholders"
            exit 1
          fi

          git add Casks/agent-pet-runtime.rb
          if git diff --cached --quiet; then
            echo "cask already current for ${VERSION}"
          else
            git commit -m "Agent Pet Runtime cask v${VERSION}"
            git push origin master
            echo "cask updated to ${VERSION}"
          fi
